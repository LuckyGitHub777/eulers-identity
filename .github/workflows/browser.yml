name: Browser UAT

on:
  push:
    branches: [main]
    paths:
      - "experience/**"
      - "tests/browser_experience.py"
      - "pyproject.toml"
      - ".github/workflows/browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "experience/**"
      - "tests/browser_experience.py"
      - "pyproject.toml"
      - ".github/workflows/browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install browser test dependency
        run: python -m pip install -e ".[browser]"

      - name: Install ${{ matrix.browser }} runtime
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser UAT smoke suite
        run: python tests/browser_experience.py --browser ${{ matrix.browser }}
