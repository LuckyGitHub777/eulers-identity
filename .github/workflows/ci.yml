name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test Python
        run: python -m pytest

      - name: Run example
        run: python examples/minimal.py

      - name: Check JavaScript syntax
        run: |
          node --check experience/app.js
          node --check experience/matrix.js
          node --check experience/phase.js
          node --check experience/modules/unit-circle.js
          node --check experience/modules/matrix-rotation.js
          node --check experience/modules/phasor.js

      - name: Test JavaScript behavior and accessibility contracts
        run: npm test

      - name: Install browser UAT dependency
        if: matrix.python-version == '3.13'
        run: python -m pip install -e ".[browser]"

      - name: Install Chromium runtime for required browser smoke
        if: matrix.python-version == '3.13'
        run: python -m playwright install --with-deps chromium

      - name: Run required Chromium browser smoke
        if: matrix.python-version == '3.13'
        run: python tests/browser_experience.py --browser chromium

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Run example
        run: python examples/minimal.py
