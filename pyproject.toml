[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eulers-identity"
version = "0.1.0"
description = "An interactive and tested introduction to Euler's identity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
  "Euler's identity",
  "Euler's formula",
  "complex numbers",
  "unit circle",
  "mathematics education"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = []

[project.urls]
Homepage = "https://eulers.id/"
Repository = "https://github.com/LuckyGitHub777/eulers-identity"
Issues = "https://github.com/LuckyGitHub777/eulers-identity/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.2,<10",
  "ruff>=0.17.3,<0.18",
  "tomli>=2,<3; python_version < '3.11'"
]
browser = [
  "playwright==1.64.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
